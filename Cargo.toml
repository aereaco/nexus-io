[workspace]
members = [".", "crates/nexus-db"]
resolver = "2"

[package]
name = "nexus"
version = "0.1.0"
description = "Nexus-IO Sovereign Binary"
edition = "2021"
license = "MIT"

[lib]
name = "nexus_io"
path = "src/lib.rs"

[features]
# =============================================================================
# Deployment Profiles (2 clean tiers — compose any profile with `gui-all`)
# =============================================================================
default = ["core"]

# Minimal sovereign microkernel: Wasmtime 51 + WASI, Nexus-DB (core+auth+cbor),
# BlobBridge + CasStore, UxGateway (HTTP/WS), IAM + CapabilitySet, NexusMetrics.
core = [
    "runtime-wasm",
    "db-auth",
    "db-cbor",
]

# Full headless platform: every domain bundle enabled (compose with `gui-all` for native WebView).
full = [
    "core",
    "runtime-all",
    "db-all",
    "net-all",
    "storage-all",
    "serve-all",
    "ops-all",
    "iam-webauthn",
]

# Standards-compliant W3C WebAuthn/FIDO2 Passkey RP verifier (optional; core stays 0 WebAuthn crates)
# Pinned version policy: audit changelog & security advisories before bumping `webauthn-rs` (MPL-2.0).
iam-webauthn = ["dep:webauthn-rs"]

# =============================================================================
# Domain 1: Runtime (Wasmtime is the sole guest runtime; JS/TS/DBs run as Wasm)
# =============================================================================
runtime-wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
runtime-oci = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:sha2",
]
runtime-all = ["runtime-wasm", "runtime-oci"]

# =============================================================================
# Domain 2: Database (1:1 granular Nexus-DB capability flags)
# =============================================================================
db-auth = ["nexus-db/auth"]
db-cbor = ["nexus-db/cbor"]
db-fts = ["nexus-db/fts"]
db-vector = ["nexus-db/vector"]
db-files = ["nexus-db/files"]
db-geo = ["nexus-db/geo"]
db-crypto = ["nexus-db/crypto"]
db-ml = ["nexus-db/ml"]
db-graphql = ["nexus-db/graphql"]
db-gql = ["nexus-db/gql"]
db-pgwire = ["nexus-db/pgwire"]
db-mysqlwire = ["nexus-db/mysqlwire"]
db-sqlite = ["nexus-db/sqlite"]
db-all = [
    "db-auth",
    "db-cbor",
    "db-fts",
    "db-vector",
    "db-files",
    "db-geo",
    "db-crypto",
    "db-ml",
    "db-graphql",
    "db-gql",
    "db-pgwire",
    "db-mysqlwire",
    "db-sqlite",
    "nexus-db/full",
]

# =============================================================================
# Domain 3: Network & Transport
# =============================================================================
net-http3 = ["salvo/quinn"]
net-acme = ["salvo/acme"]
net-openapi = ["salvo/oapi"]
net-vpn = ["dep:boringtun", "dep:wintun-bindings"]
net-all = ["net-http3", "net-acme", "net-openapi", "net-vpn"]

# =============================================================================
# Domain 4: Storage Backends
# =============================================================================
storage-p2p = ["dep:iroh", "dep:iroh-blobs"]
storage-s3 = ["dep:s3s"]
storage-all = ["storage-p2p", "storage-s3"]

# =============================================================================
# Domain 5: Serve (Nexus-UX Web Server & Hardened Hyper Reverse Proxy)
# =============================================================================
serve-web = []
serve-proxy = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:webpki-roots",
]
serve-all = ["serve-web", "serve-proxy"]

# =============================================================================
# Domain 6: Operations & Infrastructure
# =============================================================================
ops-shell = [
    "dep:nu-engine",
    "dep:nu-protocol",
    "dep:nu-command",
    "dep:nu-parser",
    "dep:nu-cmd-lang",
    "dep:nu-cli",
    "dep:rustyline",
]
ops-k8s = ["dep:serde_norway"]
ops-gpu = ["dep:nvml-wrapper"]
ops-all = ["ops-shell", "ops-k8s", "ops-gpu"]

# =============================================================================
# Domain 7: GUI (OS-Autodetected Native WebView across Windows/macOS/Linux/Android/iOS)
# =============================================================================
gui-webview = ["dep:wry", "dep:tao"]
gui-all = ["gui-webview"]

[dependencies]
# 1. The Mind (100% MIT-licensed embedded nexus-db — all features controlled strictly via `db-*` flags)
nexus-db = { path = "crates/nexus-db", default-features = false }
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs", "macros", "signal"] }

# 2. The Nerves (Optional Interactive Nushell — gated behind `ops-shell`)
nu-engine = { version = "0.117.0", optional = true }
nu-protocol = { version = "0.117.0", optional = true }
nu-command = { version = "0.117.0", optional = true, features = ["os", "network", "rand", "sqlite"] }
nu-parser = { version = "0.117.0", optional = true }
nu-cmd-lang = { version = "0.117.0", optional = true }

# 3. The Trampoline (Unified Wasmtime 51 / WASI Runtime — JS, TS, Python, SQLite, SurrealDB run as Wasm)
wasmtime = { version = "51.0.0", optional = true, default-features = false, features = ["runtime"] }
wasmtime-wasi = { version = "51.0.0", optional = true }

# 4. The Cloud (Distributed Storage & Networking — gated behind `storage-*` / `net-vpn`)
s3s = { version = "0.17.0", optional = true }
iroh = { version = "1.0.3", optional = true }
iroh-blobs = { version = "0.104.1", optional = true }
boringtun = { version = "0.7.1", optional = true }

# 5. Gateway & Networking (Salvo core HTTP/WS; HTTP/3, ACME, OpenAPI gated behind `net-*`)
salvo = { version = "1.1.1", features = ["rustls", "websocket"] }
tokio-util = { version = "0.7", features = ["codec"] }

# OCI Distribution v2 client (gated behind `runtime-oci`)
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
# W3C WebAuthn/FIDO2 RP verifier (gated behind `iam-webauthn`; pinned version, MPL-2.0)
webauthn-rs = { version = "=0.6.2", optional = true }
bytes = "1.5"
base64 = "0.22"

# Utils
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = { version = "0.9", optional = true }
sysinfo = { version = "0.31", features = ["system", "user"] }
futures = "0.3"
anyhow = "1.0"
hex = "0.4"
rand = "0.8"
once_cell = "1.19"
blake3 = "1.5"
uuid = { version = "1.6", features = ["v4"] }
toml = "0.8"
get_if_addrs = "0.5.3"

[target.'cfg(not(target_os = "ios"))'.dependencies]
wasmtime = { version = "51.0.0", optional = true, default-features = false, features = ["cranelift", "runtime", "wat"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nu-cli = { version = "0.117.0", optional = true }
rustyline = { version = "15.0", optional = true }
nvml-wrapper = { version = "0.10", optional = true }
wry = { version = "0.51", optional = true }
tao = { version = "0.33", optional = true }

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
boringtun = { version = "0.7.1", optional = true, features = ["device"] }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7.6", optional = true }

[profile.dev]
debug = 0

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
