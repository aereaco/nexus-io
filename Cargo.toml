[workspace]
members = [".", "crates/nexus-db"]
resolver = "2"

[package]
name = "nexus"
version = "0.1.0"
description = "Nexus-IO Sovereign Binary"
edition = "2021"
license = "MIT"

[lib]
name = "nexus_io"
path = "src/lib.rs"

[features]
# Deployment profiles: one platform, selective footprint.
default = ["profile-core"]

profile-core = [
    "database",
    "gateway",
    "js-runtime",
    "cells",
    "iam",
]

profile-app = [
    "profile-core",
    "p2p-storage",
    "s3-gateway",
    "sqlite-hrana",
    "graphql",
    "gql",
    "pgwire",
    "mysqlwire",
    "salvo/acme",
    "salvo/quinn",
    "salvo/oapi",
    "nexus-db/fts",
    "nexus-db/vector",
    "nexus-db/files",
    "nexus-db/auth",
    "nexus-db/cbor",
]

profile-full = [
    "profile-app",
    "wasm-runtime",
    "k8s-bridge",
    "vpn",
    "hardware-monitoring",
    "shell",
    "nexus-db/full",
]

profile-dev = [
    "profile-full",
    "surrealdb-ref",
]

# OS-specific deployment profiles (compose with `--features gui` for native OS WebView)
profile-windows = [
    "profile-app",
    "wasm-runtime",
    "vpn",
    "hardware-monitoring",
    "shell",
]

profile-linux = [
    "profile-app",
    "wasm-runtime",
    "vpn",
    "k8s-bridge",
    "hardware-monitoring",
    "shell",
]

profile-macos = [
    "profile-app",
    "wasm-runtime",
    "vpn",
    "shell",
]

profile-android = [
    "profile-app",
    "wasm-runtime",
]

profile-ios = [
    "profile-app",
    "wasm-runtime",
]

# Granular capability flags
database = []
gateway = []
js-runtime = []
cells = []
iam = []
sqlite-hrana = ["nexus-db/sqlite"]
graphql = ["nexus-db/graphql"]
gql = ["nexus-db/gql"]
pgwire = ["nexus-db/pgwire"]
mysqlwire = ["nexus-db/mysqlwire"]
p2p-storage = ["dep:iroh", "dep:iroh-blobs"]
s3-gateway = ["dep:s3s"]
shell = ["dep:nu-cli", "dep:rustyline"]
wasm-runtime = ["dep:wasmtime", "dep:wasmtime-wasi"]
k8s-bridge = ["dep:serde_norway"]
vpn = ["dep:boringtun", "dep:wintun-bindings"]
hardware-monitoring = ["dep:nvml-wrapper"]
gui = ["dep:wry", "dep:tao"]
surrealdb-ref = ["dep:surrealdb"]

[dependencies]
# 1. The Mind (State — MIT-licensed nexus-db by default; optional surrealdb-ref for differential tests)
nexus-db = { path = "crates/nexus-db", default-features = false, features = ["auth", "cbor"] }
surrealdb = { version = "4.0.1", optional = true, default-features = false, features = ["kv-mem"] }
sqlparser = "0.64.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs", "macros", "signal"] }

# 2. The Nerves (Logic/Shell)
nu-engine = "0.117.0"
nu-protocol = "0.117.0"
nu-command = { version = "0.117.0", features = ["os", "network", "rand", "sqlite"] }
nu-parser = "0.117.0"
nu-cmd-lang = "0.117.0"

# 3. The Trampoline (Pure-Rust JS + Native TS via OXC + optional Wasmtime/WASI Crystal Cells)
quickrs-core = "0.16.2"
wasmtime = { version = "51.0.0", optional = true, default-features = false, features = ["runtime"] }
wasmtime-wasi = { version = "51.0.0", optional = true }

# Tier S: Native TypeScript (OXC)
oxc_allocator = { version = "0.144.0", features = ["serialize"] }
oxc_parser = "0.144.0"
oxc_semantic = "0.144.0"
oxc_transformer = "0.144.0"
oxc_codegen = "0.144.0"
oxc_span = { version = "0.144.0", features = ["serialize"] }
oxc_ast = { version = "0.144.0", features = ["serialize"] }

# 4. The Cloud (Cross-Platform Distributed Storage & Networking — optional behind `p2p-storage` / `s3-gateway`)
s3s = { version = "0.17.0", optional = true }
iroh = { version = "1.0.3", optional = true }
iroh-blobs = { version = "0.104.1", optional = true }

# WireGuard - Zero-Trust VPN Mesh (optional behind `vpn`)
boringtun = { version = "0.7.1", optional = true }

# Networking & UX Gateway (Salvo — lean Core default; QUIC/ACME/OpenAPI enabled in profile-app+)
salvo = { version = "1.1.1", features = ["rustls", "websocket"] }

# Networking & Async Utils
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
base64 = "0.22"

# Utils
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = { version = "0.9", optional = true }
sysinfo = { version = "0.31", features = ["system", "user"] }
futures = "0.3"
anyhow = "1.0"
hex = "0.4"
rand = "0.8"
once_cell = "1.19"
blake3 = "1.5"
uuid = { version = "1.6", features = ["v4"] }
toml = "0.8"
get_if_addrs = "0.5.3"

[target.'cfg(not(target_os = "ios"))'.dependencies]
wasmtime = { version = "51.0.0", optional = true, default-features = false, features = ["cranelift", "runtime", "wat"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nu-cli = { version = "0.117.0", optional = true }
rustyline = { version = "15.0", optional = true }
nvml-wrapper = { version = "0.10", optional = true }
wry = { version = "0.51", optional = true }
tao = { version = "0.33", optional = true }

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
boringtun = { version = "0.7.1", optional = true, features = ["device"] }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7.6", optional = true }

[profile.dev]
debug = 0

[profile.dev.package.surrealdb-core]
opt-level = 1

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
