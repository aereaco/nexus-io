[workspace]
members = [".", "crates/nexus-db"]
resolver = "2"

[package]
name = "nexus"
version = "0.1.0"
description = "Nexus-IO Sovereign Binary"
edition = "2021"
license = "MIT"

[lib]
name = "nexus_io"
path = "src/lib.rs"

[dependencies]
# 1. The Mind (State)
surrealdb = { version = "4.0.1", default-features = false, features = ["kv-mem", "kv-surrealkv"] } # SQL included, Scripting (Internal QuickJS) disabled
nexus-db = { path = "crates/nexus-db" }
sqlparser = "0.64.0"
tokio = { version = "1.0", features = ["full"] }

# 2. The Nerves (Logic/Shell)
nu-engine = "0.117.0"
nu-protocol = "0.117.0"
nu-command = { version = "0.117.0", features = ["os", "network", "rand", "sqlite"] }
nu-parser = "0.117.0"
nu-cmd-lang = "0.117.0"

# 3. The Trampoline (Pure-Rust JS + Native TS via OXC + Wasmtime Crystal Cells)
# Tier A: Pure-Rust Universal JS Baseline (Windows, Linux, macOS, Android, iOS W^X compliant)
quickrs-core = "0.16.2"
# Tier B: Crystal Cells (Wasmtime AOT runtime on all platforms; Cranelift JIT/AOT compiler on non-iOS)
wasmtime = { version = "51.0.0", default-features = false, features = ["runtime"] }

# Tier S: Native TypeScript (OXC)
oxc_allocator = { version = "0.144.0", features = ["serialize"] }
oxc_parser = "0.144.0"
oxc_semantic = "0.144.0"
oxc_transformer = "0.144.0"
oxc_codegen = "0.144.0"
oxc_span = { version = "0.144.0", features = ["serialize"] }
oxc_ast = { version = "0.144.0", features = ["serialize"] }

# Tier B: Sovereign AOT (LLVM)
# Note: Requires system LLVM installation.
# inkwell = { version = "0.4.0", features = ["target-x86", "target-aarch64"] }

# 4. The Cloud (Cross-Platform Distributed Storage & Networking)
# Pure-Rust S3 + P2P BLAKE3 Blob Mesh (Windows, Linux, macOS parity)
s3s = "0.17.0"
iroh = "1.0.3"
iroh-blobs = "0.104.1"

# WireGuard - Zero-Trust VPN Mesh
boringtun = "0.7.1"
# Note: x25519-dalek provided transitively by boringtun

# Networking & UX Gateway (Salvo)
salvo = { version = "1.1.1", features = ["acme", "quinn", "rustls", "websocket", "oapi"] }

# Networking & Async Utils
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
base64 = "0.22"

# Utils
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sysinfo = { version = "0.31", features = ["system", "user"] }
futures = "0.3"
anyhow = "1.0"
hex = "0.4"
rand = "0.8"
once_cell = "1.19"
blake3 = "1.5"
uuid = { version = "1.6", features = ["v4"] }
toml = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled"] }
get_if_addrs = "0.5.3"

[target.'cfg(not(target_os = "ios"))'.dependencies]
wasmtime = { version = "51.0.0", default-features = false, features = ["cranelift", "runtime", "wat"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nu-cli = "0.117.0"
rustyline = "15.0"
nvml-wrapper = "0.10"

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
boringtun = { version = "0.7.1", features = ["device"] }

[target.'cfg(windows)'.dependencies]
wintun-bindings = "0.7.6"

[profile.dev]
debug = 0

[profile.dev.package.surrealdb-core]
opt-level = 1
