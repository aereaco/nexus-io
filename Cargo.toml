[package]
name = "nexus"
version = "0.1.0"
description = "Nexus-IO Sovereign Binary"
edition = "2021"

[dependencies]
# 1. The Mind (State)
surrealdb = { version = "3.0.0-beta.2", default-features = false, features = ["kv-mem", "kv-surrealkv"] } # SQL included, Scripting (Internal QuickJS) disabled
tokio = { version = "1.0", features = ["full"] }

# 2. The Nerves (Logic/Shell)
nu-engine = "0.110.0"
nu-protocol = "0.110.0"
nu-command = { version = "0.110.0", features = ["os", "network", "rand", "sqlite"] }
nu-parser = "0.110.0"
nu-cmd-lang = "0.110.0"
nu-cli = "0.110.0"
rustyline = "15.0"

# 3. The Trampoline (JS/JIT Tier)
# Tier A: Interpreter
quickjs-rusty = { version = "0.10", features = ["serde"] }
libquickjs-ng-sys = "0.9.6"

# Tier S: Sovereign TypeScript (OXC)
oxc_allocator = { version = "0.13", features = ["serialize"] }
oxc_parser = "0.13"
oxc_transformer = "0.13"
oxc_codegen = "0.13"
oxc_span = { version = "0.13", features = ["serialize"] }
oxc_ast = { version = "0.13", features = ["serialize"] }

# Tier B: Sovereign AOT (LLVM)
# Note: Requires system LLVM installation.
# inkwell = { version = "0.4.0", features = ["target-x86", "target-aarch64"] }

# 4. The Cloud (Distributed Storage & Networking)
# Garage DHT - Distributed Object Storage (Direct Embedding)
garage_rpc = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", tag = "v2.2.0" }
garage_table = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", tag = "v2.2.0" }
garage_util = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", tag = "v2.2.0", default-features = false, features = [] }
garage_model = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", tag = "v2.2.0" }
garage_block = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", tag = "v2.2.0" }
garage_db = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", tag = "v2.2.0", default-features = false, features = ["sqlite"] }
garage_net = { git = "https://git.deuxfleurs.fr/Deuxfleurs/garage.git", tag = "v2.2.0" }

# WireGuard - Zero-Trust VPN Mesh
boringtun = { version = "0.6", features = ["device"] }
# Note: x25519-dalek provided transitively by boringtun

# Networking & UX Gateway (Salvo)
salvo = { version = "0.76", features = ["acme", "quinn", "rustls", "websocket", "oapi"] }

# Networking & Async Utils
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
base64 = "0.22"

# Utils
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.31", features = ["system", "user"] }
futures = "0.3"
anyhow = "1.0"
hex = "0.4"
rand = "0.8"
once_cell = "1.19"
blake3 = "1.5"
uuid = { version = "1.6", features = ["v4"] }
toml = "0.8"
rusqlite = { version = "0.37.0", features = ["bundled"] }
get_if_addrs = "0.5.3"
nvml-wrapper = "0.10"
