[package]
name = "nexus-db"
version = "0.1.0"
edition = "2021"
description = "Clean-room, ultra-low-footprint SurrealQL-compatible embedded multi-model database (Synchronous Volcano Engine on redb)"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
redb = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
