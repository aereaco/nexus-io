[package]
name = "nexus-db"
version = "0.1.0"
edition = "2021"
description = "Clean-room, MIT-licensed, ultra-low-footprint SurrealQL-compatible embedded multi-model database (Synchronous Volcano Engine on redb)"
license = "MIT"

[features]
default = ["fts", "vector", "files", "auth"]
fts = []
vector = []
files = []
auth = ["dep:argon2", "dep:hmac", "dep:sha2", "dep:base64", "dep:subtle", "dep:ed25519-dalek"]
geo = []
crypto = ["dep:blake3"]
cbor = []
graphql = []
ml = []
gql = []
pgwire = []
full = ["fts", "vector", "files", "auth", "geo", "crypto", "cbor", "graphql", "ml", "gql", "pgwire"]

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", optional = true }
base64 = { version = "0.22", optional = true }
blake3 = { version = "1.5", optional = true }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", optional = true }
hmac = { version = "0.12", optional = true }
redb = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
uuid = { version = "1.6", features = ["v4"] }
