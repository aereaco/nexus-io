[package]
name = "nexus-db"
version = "0.1.0"
edition = "2021"
description = "Clean-room, MIT-licensed, ultra-low-footprint SurrealQL-compatible embedded multi-model database (Synchronous Volcano Engine on redb)"
license = "MIT"

[features]
default = ["fts", "vector", "files", "auth"]
fts = []
vector = []
files = []
auth = []
geo = []
crypto = ["dep:blake3"]
cbor = []
graphql = []
ml = []
gql = []
pgwire = []
full = ["fts", "vector", "files", "auth", "geo", "crypto", "cbor", "graphql", "ml", "gql", "pgwire"]

[dependencies]
anyhow = "1.0"
blake3 = { version = "1.5", optional = true }
chrono = { version = "0.4", features = ["serde"] }
redb = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
